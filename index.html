  const FONT = '"Courier New", ui-monospace, monospace';
  const LV = [

    { name: '동네 단위', bpm: 120, dens: .62, lead: 1.5, civ: .08 },
    { name: '도시 기능 마비', bpm: 132, dens: .72, lead: 1.3, civ: .1 },
    { name: '인류 존속 위기', bpm: 156, dens: .9, lead: .95, civ: .16, eighths: true, tight: true },

    text(G.failed ? 'FAILED' : grade, 0, G.failed ? 7 : 14, G.failed ? 18 : 38, G.failed ? C.red : C.org, 'center', '900'); ctx.restore();
    const q = QUOTES[grade]; ctx.fillStyle = '#0b0d10'; ctx.fillRect(px + 16, py + 246, pw - 32, 30);
    text('FELIX ▸ ' + q[0], px + 24, py + 258, 9, C.org2); text('(' + q[1] + ')', px + 24, py + 271, 9, C.ink, 'left', 'normal');
    button(px, 310, 216, 32, '다시 출동', () => { initAudio(); newGame(S.level); }, true);
    button(px + 232, 310, 216, 32, '레벨 선택', () => { S.scene = 'title'; G = null; titleT0 = SAFE.now() / 1000; });
  }

  // ---------- loop & input ----------
  let last = SAFE.now() / 1000;
  function frame() {
    if (!alive) return;
    const now = SAFE.now() / 1000, dt = Math.min(.05, now - last); last = now;
    ctx.setTransform(RS, 0, 0, RS, 0, 0);
    if (S.scene === 'play' && G) { const t = songT(); if (!S.paused) { schedule(); update(t, dt); G.lastT = t; } if (S.scene === 'play') drawPlay(G.lastT); }
    if (S.scene === 'title') drawTitle(now);
    if (S.scene === 'result' && G) drawResult(now);
    scan();
    raf = SAFE.raf(frame);
  }
  function toXY(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  function onDown(e) {
    e.preventDefault(); const p = toXY(e);
    for (let i = btns.length - 1; i >= 0; i--) { const b = btns[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { initAudio(); b.fn(); return; } }
    if (S.scene === 'play' && G && !S.paused && songT() > 0) clickPlay(p.x, p.y);
  }
  function onKey(e) {
    if (S.scene === 'play' && G) {
      if (e.code === 'Escape' || e.code === 'KeyP') { pause(!S.paused); return; }
      
    } else if (S.scene === 'title' && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); initAudio(); newGame(S.level); }
    else if (S.scene === 'title' && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) { S.level = (S.level + (e.code === 'ArrowUp' ? 4 : 1)) % 5; }
  }
  function onVis() { if (SAFE.doc().hidden) pause(true); }
  if (!opts.noInput) { canvas.addEventListener('pointerdown', onDown); SAFE.on(SAFE.win(), 'keydown', onKey); SAFE.on(SAFE.doc(), 'visibilitychange', onVis); }
  canvas.style.touchAction = 'manipulation';
  if (opts.autoplay) newGame(S.level);
  if (!opts.manual) raf = SAFE.raf(frame);
  return {
    destroy() { alive = false; SAFE.caf(raf); canvas.removeEventListener('pointerdown', onDown); SAFE.off(SAFE.win(), 'keydown', onKey); SAFE.off(SAFE.doc(), 'visibilitychange', onVis); if (A) A.close(); },
    renderAt(t, dt) { ctx.setTransform(RS, 0, 0, RS, 0, 0); if (S.scene === 'play') { update(t, dt || 1 / 30); if (S.scene === 'play') drawPlay(t); else drawResult(t); } else if (S.scene === 'result') drawResult(t); else drawTitle(t); scan(); },
    state: S, get game() { return G; }
  };
}
if (typeof window !== 'undefined') window.createScarGame = createScarGame;
